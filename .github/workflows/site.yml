# Publishes the site to GitHub Pages with Charlotte's current weather (National Weather Service, Charlotte Douglas
# airport) in weather.json. Runs on every push to main, every 30 minutes, and on demand (Actions > Site > Run workflow).
# Needs one setting: Settings > Pages > Source = "GitHub Actions". No key or secret.
# Only the site's own files are published (index.html, vote/, privacy/, CNAME, images, js, weather.json); this file, the weather
# script and the README stay in the repository and are not public pages.
name: Site
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Two jobs (build, then deploy) with a short wait and one retry: since November 25, 2026, GitHub sometimes
  # can't find a just-uploaded site ("No artifacts named github-pages"); waiting and retrying gets past it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Collect the site files
        run: |
          mkdir _site
          cp -R index.html vote privacy CNAME images js _site/
      - name: Fetch Charlotte weather
        # If the weather service is down, the site still publishes; the header just hides the weather.
        continue-on-error: true
        run: node scripts/weather.mjs _site/weather.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Give GitHub a moment to list the upload
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
